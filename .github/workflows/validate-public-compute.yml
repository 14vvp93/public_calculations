name: Validate public compute tasks

on:
  push:
    branches: [main]
    paths:
      - firmware/COMPUTE_VALIDATION_TRIGGER

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/compute.yml
    with:
      task: verify
      retention_days: "14"
  audio-inventory:
    uses: ./.github/workflows/compute.yml
    with:
      task: audio-inventory
      retention_days: "14"
