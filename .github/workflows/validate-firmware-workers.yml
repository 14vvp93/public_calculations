name: Validate all public firmware workers

on:
  push:
    branches: [main]
    paths:
      - firmware/WORKER_VALIDATION_TRIGGER

permissions:
  contents: read

jobs:
  audio-hal:
    uses: ./.github/workflows/worker-analyze-audio-hal.yml
  cd3313-ioctl:
    uses: ./.github/workflows/worker-analyze-cd3313-ioctl.yml
  cd3313-static:
    uses: ./.github/workflows/worker-analyze-cd3313.yml
  firmware-images:
    uses: ./.github/workflows/worker-analyze-firmware-images.yml
  firmware-libraries:
    uses: ./.github/workflows/worker-analyze-firmware-libraries.yml
  firmware-integrity:
    uses: ./.github/workflows/worker-audit-reference-archives.yml
  heq-decompile:
    uses: ./.github/workflows/worker-decompile-heq.yml
  audio-config:
    uses: ./.github/workflows/worker-firmware-audio-config-audit.yml
  audiomux-scan:
    uses: ./.github/workflows/worker-scan-audiomux-clients.yml
