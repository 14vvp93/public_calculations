name: Analyze MT8163 firmware images

on:
  workflow_call:
    inputs:
permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public firmware dataset
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 14vvp93/public_calculations
          ref: main
          path: worker
          persist-credentials: false



      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler file cpio lz4

      - name: Get AOSP boot image unpacker
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg

      - name: Inspect DTBO, boot and recovery images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-analysis/unpacked image-analysis/dtbo
          report=image-analysis/REPORT.txt
          : > "$report"

          for image in worker/firmware/dumps/mt8163/dtbo.img worker/firmware/dumps/mt8163/recovery.img worker/firmware/dumps/mt8163/boot.img; do
            if [ -f "$image" ]; then
              {
                echo "===== $image ====="
                stat -c 'size_bytes=%s' "$image"
                sha256sum "$image"
                file "$image"
                echo "first_64_bytes:"
                xxd -l 64 "$image"
                echo
              } | tee -a "$report"
            fi
          done

          python3 - <<'PY' | tee -a "$report"
          import struct
          from pathlib import Path

          p = Path("worker/firmware/dumps/mt8163/dtbo.img")
          if not p.exists():
              print("DTBO image not found")
              raise SystemExit(0)
          b = p.read_bytes()
          if len(b) < 32:
              print("DTBO: too small for header")
              raise SystemExit(0)
          vals = struct.unpack(">8I", b[:32])
          magic, total, hsize, esize, count, entries_off, page, version = vals
          print(f"DTBO header: magic=0x{magic:08x} total={total} header_size={hsize} entry_size={esize} count={count} entries_offset={entries_off} page_size={page} version={version}")
          if magic != 0xd7b7ab1e:
              print("DTBO header magic does not match Android dt_table")
              raise SystemExit(0)
          if hsize < 32 or esize < 32 or count > 4096 or entries_off + count * esize > len(b):
              print("DTBO table bounds are invalid; refusing extraction")
              raise SystemExit(0)
          out = Path("image-analysis/dtbo")
          for i in range(count):
              off = entries_off + i * esize
              size, data_off, ident, rev, c0, c1, c2, c3 = struct.unpack(">8I", b[off:off+32])
              if size == 0 or data_off + size > len(b):
                  print(f"entry[{i}]: invalid bounds size={size} offset={data_off}")
                  continue
              dst = out / f"dtb-{i:03d}.dtb"
              dst.write_bytes(b[data_off:data_off+size])
              print(f"entry[{i}]: size={size} offset={data_off} id={ident} rev={rev} custom={[c0,c1,c2,c3]} -> {dst}")
          PY

          for dtb in image-analysis/dtbo/*.dtb; do
            [ -f "$dtb" ] || continue
            {
              echo "===== DTB $dtb ====="
              file "$dtb"
              dtc -I dtb -O dts "$dtb" 2>/dev/null | grep -Ein -C 2 'audio|sound|i2s|codec|cd3313|speaker|amplifier|amp|mediatek' | head -n 240 || true
              echo
            } | tee -a "$report"
          done

          for image in worker/firmware/dumps/mt8163/recovery.img worker/firmware/dumps/mt8163/boot.img; do
            [ -f "$image" ] || continue
            name=$(basename "$image" .img)
            out="image-analysis/unpacked/$name"
            mkdir -p "$out"
            {
              echo "===== Unpack $image ====="
              python3 /tmp/mkbootimg/unpack_bootimg.py --boot_img "$image" --out "$out" 2>&1 || true
              find "$out" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
              for f in "$out"/*; do
                [ -f "$f" ] || continue
                echo "--- strings: $f ---"
                strings -a "$f" | grep -Ei 'audiomux|ExtAudioMuxer|SendCmdAudioMux|sourceinfo|cd3313|audio_device|mixer_paths|audio_policy|init\.|\.rc$|libandroid_servers' | head -n 200 || true
              done
              echo
            } | tee -a "$report"
          done

          echo "===== ELF inventory in extracted image files =====" | tee -a "$report"
          find image-analysis/unpacked -type f -print0 | while IFS= read -r -d '' f; do
            if head -c 4 "$f" | grep -q $'\\x7fELF'; then file "$f"; fi
          done | tee -a "$report"

      - name: Upload firmware analysis
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-firmware-image-analysis
          path: image-analysis/
          if-no-files-found: error
          retention-days: 14
