name: Validate compute infrastructure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Run firmware tool tests
        run: python -m unittest discover -s tests -v
      - name: Check scripts have CLI help
        run: |
          python scripts/firmware/archive_inventory.py --help
          python scripts/firmware/safe_extract.py --help
