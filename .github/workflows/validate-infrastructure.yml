name: Validate compute infrastructure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Run firmware tool tests
        run: python -m unittest discover -s tests -v
      - name: Check scripts have CLI help
        run: |
          python scripts/firmware/archive_inventory.py --help
          python scripts/firmware/safe_extract.py --help
          python scripts/firmware/process_archive_sets.py --help
          python scripts/firmware/build_source_manifest.py --help
