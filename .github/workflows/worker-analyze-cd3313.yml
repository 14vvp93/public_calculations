name: Analyze CD3313 kernel module

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable branch, tag, or commit in the primary repository
        required: false
        type: string
        default: main
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public firmware dataset
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 14vvp93/public_calculations
          ref: main
          path: worker
          persist-credentials: false



      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-arm-linux-gnueabi binutils-multiarch file python3

      - name: Validate module
        run: |
          test -s worker/firmware/dumps/mt8163/kernel/cd3313.ko
          file worker/firmware/dumps/mt8163/kernel/cd3313.ko | tee module-file.txt
          sha256sum worker/firmware/dumps/mt8163/kernel/cd3313.ko | tee module-sha256.txt

      - name: Generate static analysis reports
        run: |
          mkdir -p cd3313-analysis
          cp module-file.txt module-sha256.txt cd3313-analysis/
          set +e
          run_report() {
            name="$1"
            shift
            "$@" > "cd3313-analysis/$name" 2>&1
            code=$?
            printf '%s\texit=%s\n' "$name" "$code" >> cd3313-analysis/command-status.txt
          }
          run_report elf-header.txt readelf -h worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report sections.txt readelf -S worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report symbols-readelf.txt readelf -sW worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report relocations.txt readelf -rW worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report dwarf-info.txt readelf --debug-dump=info worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report dwarf-lines.txt readelf --debug-dump=decodedline worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report disassembly-lines.txt objdump -m arm -dlwC worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report address-to-source.txt addr2line -e worker/firmware/dumps/mt8163/kernel/cd3313.ko -f -i 0x11ec 0x1200 0x1288 0x139c 0x14ac 0x14f0 0x1538 0x15fc 0x163c 0x1694 0x1788 0x1818 0x1858 0x188c
          run_report symbols-nm.txt nm -an worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report strings.txt strings -a -n 4 -t x worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report disassembly-relocations.txt objdump -m arm -drwC worker/firmware/dumps/mt8163/kernel/cd3313.ko
          run_report section-bytes.txt arm-linux-gnueabi-objdump -s worker/firmware/dumps/mt8163/kernel/cd3313.ko
          true
          {
            echo "# CD3313 module analysis"
            echo
            echo "Generated from repository file worker/firmware/dumps/mt8163/kernel/cd3313.ko."
            echo
            echo '## Module identity'
            cat module-file.txt
            cat module-sha256.txt
            echo
            echo '## Report files'
            find cd3313-analysis -maxdepth 1 -type f -printf '%f\n' | sort
          } > cd3313-analysis/README.md

      - name: Upload analysis reports
        uses: actions/upload-artifact@v6
        with:
          name: cd3313-static-analysis
          path: cd3313-analysis/
          if-no-files-found: error
          retention-days: 14
