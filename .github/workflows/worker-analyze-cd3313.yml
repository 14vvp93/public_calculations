name: Analyze CD3313 kernel module

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable branch, tag, or commit in the primary repository
        required: false
        type: string
        default: main
    secrets:
      SOURCE_REPO_READ_TOKEN:
        required: false
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate read-only access to primary repository
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Add SOURCE_REPO_READ_TOKEN to the caller repository's Actions secrets. It must be a fine-grained token with Contents: Read-only access to 14vvp93/mt8163_audio_engine."
            exit 2
          fi

      - name: Check out primary repository at requested revision
        uses: actions/checkout@v5
        with:
          repository: 14vvp93/mt8163_audio_engine
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-arm-linux-gnueabi binutils-multiarch file python3

      - name: Validate module
        run: |
          test -s source/reference-materials/kernel/cd3313.ko
          file source/reference-materials/kernel/cd3313.ko | tee module-file.txt
          sha256sum source/reference-materials/kernel/cd3313.ko | tee module-sha256.txt

      - name: Generate static analysis reports
        run: |
          mkdir -p cd3313-analysis
          cp module-file.txt module-sha256.txt cd3313-analysis/
          set +e
          run_report() {
            name="$1"
            shift
            "$@" > "cd3313-analysis/$name" 2>&1
            code=$?
            printf '%s\texit=%s\n' "$name" "$code" >> cd3313-analysis/command-status.txt
          }
          run_report elf-header.txt readelf -h source/reference-materials/kernel/cd3313.ko
          run_report sections.txt readelf -S source/reference-materials/kernel/cd3313.ko
          run_report symbols-readelf.txt readelf -sW source/reference-materials/kernel/cd3313.ko
          run_report relocations.txt readelf -rW source/reference-materials/kernel/cd3313.ko
          run_report dwarf-info.txt readelf --debug-dump=info source/reference-materials/kernel/cd3313.ko
          run_report dwarf-lines.txt readelf --debug-dump=decodedline source/reference-materials/kernel/cd3313.ko
          run_report disassembly-lines.txt objdump -m arm -dlwC source/reference-materials/kernel/cd3313.ko
          run_report address-to-source.txt addr2line -e source/reference-materials/kernel/cd3313.ko -f -i 0x11ec 0x1200 0x1288 0x139c 0x14ac 0x14f0 0x1538 0x15fc 0x163c 0x1694 0x1788 0x1818 0x1858 0x188c
          run_report symbols-nm.txt nm -an source/reference-materials/kernel/cd3313.ko
          run_report strings.txt strings -a -n 4 -t x source/reference-materials/kernel/cd3313.ko
          run_report disassembly-relocations.txt objdump -m arm -drwC source/reference-materials/kernel/cd3313.ko
          run_report section-bytes.txt arm-linux-gnueabi-objdump -s source/reference-materials/kernel/cd3313.ko
          true
          {
            echo "# CD3313 module analysis"
            echo
            echo "Generated from repository file source/reference-materials/kernel/cd3313.ko."
            echo
            echo '## Module identity'
            cat module-file.txt
            cat module-sha256.txt
            echo
            echo '## Report files'
            find cd3313-analysis -maxdepth 1 -type f -printf '%f\n' | sort
          } > cd3313-analysis/README.md

      - name: Upload analysis reports
        uses: actions/upload-artifact@v6
        with:
          name: cd3313-static-analysis
          path: cd3313-analysis/
          if-no-files-found: error
          retention-days: 14
