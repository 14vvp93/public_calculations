name: Focused CD3313 ioctl ABI analysis

on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  ioctl-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public firmware dataset
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 14vvp93/public_calculations
          ref: main
          path: worker
          persist-credentials: false



      - name: Install ARM analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-arm-linux-gnueabi file python3

      - name: Validate module identity
        run: |
          test -s worker/firmware/dumps/mt8163/kernel/cd3313.ko
          file worker/firmware/dumps/mt8163/kernel/cd3313.ko | tee module-file.txt
          sha256sum worker/firmware/dumps/mt8163/kernel/cd3313.ko | tee module-sha256.txt
          grep -q 'b9ef172de1532867208fc620d4fe8d24612aa2ee4ad2d62ab2daaf6622387afb' module-sha256.txt

      - name: Extract ioctl and command-dispatch functions
        run: |
          mkdir -p cd3313-ioctl-analysis
          cp module-file.txt module-sha256.txt cd3313-ioctl-analysis/
          nm -anC worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/symbols.txt
          readelf -h worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/elf-header.txt
          readelf -SW worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/sections.txt
          readelf -rW worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/relocations.txt
          arm-linux-gnueabi-objdump -s -j .rodata worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/rodata-dump.txt 2>&1 || true
          arm-linux-gnueabi-objdump -s -j .data worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/data-dump.txt 2>&1 || true
          arm-linux-gnueabi-objdump -s -j .bss worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/bss-dump.txt 2>&1 || true
          readelf --debug-dump=info worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/dwarf-info.txt
          arm-linux-gnueabi-readelf --debug-dump=rawline worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/dwarf-rawline.txt
          arm-linux-gnueabi-readelf --debug-dump=decodedline worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/dwarf-lines.txt
          strings -tx worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/strings-offsets.txt
          arm-linux-gnueabi-readelf --string-dump=.rodata.str1.4 worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/rodata-strings.txt 2>&1 || true
          arm-linux-gnueabi-objdump -s -j .rodata.str1.4 worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/rodata-str1-dump.txt 2>&1 || true
          nm -anS worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/symbols-sized.txt
          arm-linux-gnueabi-objdump --dwarf=decodedline worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/disassembly-lines.txt
          arm-linux-gnueabi-objdump -drwC worker/firmware/dumps/mt8163/kernel/cd3313.ko > cd3313-ioctl-analysis/full-disassembly.txt
          for symbol in cmd_ioctl cmd_read cmd_write event_callback set_master_mute set_master_volume.part.0 cd3313_write_reg.constprop.4 set_input_channel dsp_shutdown dsp_probe dsp_wakeup.part.1 dsp_driver_init; do
            arm-linux-gnueabi-objdump -drwC --disassemble="$symbol" worker/firmware/dumps/mt8163/kernel/cd3313.ko > "cd3313-ioctl-analysis/$symbol.txt" 2>&1 || true
          done
          {
            for symbol in cmd_ioctl cmd_read cmd_write event_callback set_master_mute set_master_volume.part.0 cd3313_write_reg.constprop.4 set_input_channel dsp_shutdown dsp_probe dsp_wakeup.part.1 dsp_driver_init; do
              address="$(nm -an worker/firmware/dumps/mt8163/kernel/cd3313.ko | awk -v name="$symbol" '$3 == name { print "0x" $1; exit }')"
              if [ -n "$address" ]; then
                printf '%s (%s): ' "$symbol" "$address"
                arm-linux-gnueabi-addr2line -e worker/firmware/dumps/mt8163/kernel/cd3313.ko -f -C "$address" | tr '\n' ' '
                printf '\n'
              else
                printf '%s: symbol not present (inlined or optimized out)\n' "$symbol"
              fi
            done
          } > cd3313-ioctl-analysis/address-to-source.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path("cd3313-ioctl-analysis")
          symbols = (root / "symbols.txt").read_text(errors="replace").splitlines()
          wanted = ("cmd_ioctl", "cmd_read", "cmd_write", "event_callback", "do_cmd_write", "cd3313_voltable_40", "cd3313_speaker", "cd3313_equalizer")
          rows = [line for line in symbols if any(re.search(r"\b" + re.escape(name) + r"\b", line) for name in wanted)]
          (root / "target-symbols.txt").write_text("\n".join(rows) + ("\n" if rows else ""))

          raw = subprocess.run(["nm", "-an", "worker/firmware/dumps/mt8163/kernel/cd3313.ko"], check=True, text=True, capture_output=True).stdout
          queue_symbols = []
          for line in raw.splitlines():
              fields = line.split()
              if len(fields) >= 3 and fields[1] in ("t", "T") and re.search(r"event|queue|delayed|work|timer|remove", fields[2], re.I):
                  queue_symbols.append((fields[2], fields[0]))
          queue_symbols = queue_symbols[:40]
          (root / "event-queue-symbols.txt").write_text(
              "\n".join(f"{address} {name}" for name, address in queue_symbols) + ("\n" if queue_symbols else "")
          )

          reports = []
          for name, _ in queue_symbols:
              result = subprocess.run(
                  ["arm-linux-gnueabi-objdump", "-drwC", f"--disassemble={name}", "worker/firmware/dumps/mt8163/kernel/cd3313.ko"],
                  check=False, text=True, capture_output=True
              )
              reports.append(f"===== {name} =====\n{result.stdout}{result.stderr}")
          (root / "event-queue-disassembly.txt").write_text(
              "\n".join(reports) if reports else "No separately named event/queue/work/timer functions survived in the symbol table.\n"
          )
          print("=== EVENT / QUEUE SYMBOLS ===")
          print((root / "event-queue-symbols.txt").read_text() or "(none)")
          print("=== EVENT / QUEUE DISASSEMBLY ===")
          print((root / "event-queue-disassembly.txt").read_text())
          PY
          {
            echo "# Focused CD3313 ioctl analysis"
            echo
            cat module-file.txt
            cat module-sha256.txt
            echo
            echo "Focused ARM disassembly and DWARF source-line reports are provided where available."
            echo "address-to-source.txt maps surviving functions to their original cd3313.c lines."
            echo "sections.txt and relocation reports expose ELF data placement; rodata/data dumps preserve static lookup tables where present."
            echo "event-queue-symbols.txt and event-queue-disassembly.txt capture surviving queue-related symbols and their ARM disassembly."
            echo "dwarf-rawline.txt preserves the DWARF file table; strings-offsets.txt and rodata-strings.txt expose format strings used by cmd_read and cmd_write."
            echo "symbols-sized.txt includes symbol sizes for static table and object-length checks."
            echo "An empty function report means the symbol was inlined, optimized out, or not exported under that name."
            echo
            find cd3313-ioctl-analysis -maxdepth 1 -type f -printf '%f\n' | sort
          } > cd3313-ioctl-analysis/README.md

      - name: Upload focused analysis
        uses: actions/upload-artifact@v6
        with:
          name: cd3313-ioctl-abi-analysis
          path: cd3313-ioctl-analysis/
          if-no-files-found: error
          retention-days: 14
