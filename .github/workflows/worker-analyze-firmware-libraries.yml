name: Analyze all extracted firmware libraries and CD3313

on:
  workflow_call:
permissions:
  contents: read

jobs:
  reassemble-and-analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public firmware dataset
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 14vvp93/public_calculations
          ref: main
          path: worker
          persist-credentials: false



      - name: Load and verify canonical extracted firmware dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path("worker")
          manifest = json.loads((root / "firmware/manifests/mt8163-extracted.json").read_text())
          entries = manifest["files"]
          if manifest["file_count"] != 1386 or len(entries) != 1386:
              raise SystemExit("Unexpected extracted firmware file count")
          for item in entries:
              path = root / item["path"]
              if not path.is_file() or path.stat().st_size != item["size"]:
                  raise SystemExit(f"Missing or size mismatch: {path}")
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              if h.hexdigest() != item["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {path}")
          print(f"Verified {len(entries)} extracted firmware files ({manifest['total_bytes']} bytes)")
          PY
          mkdir -p firmware-analysis/firmware-dumps
          cp -a worker/firmware/extracted/. firmware-analysis/
          cp -a worker/firmware/dumps/mt8163/. firmware-analysis/firmware-dumps/
      - name: Build pinned VDEX extractor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev binutils-arm-linux-gnueabi device-tree-compiler
          git clone https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          git -C /tmp/vdexExtractor checkout 78f283b60ab6991fa27eeaff7d7be16409401c08
          sed -i 's/-Wall -Wextra -Werror/-Wall -Wextra -Werror -Wno-error=vla-parameter/' /tmp/vdexExtractor/src/Makefile
          cd /tmp/vdexExtractor
          ./make.sh gcc
          test -x bin/vdexExtractor

      - name: Disassemble carservices CompactDex
        shell: bash
        run: |
          set -euo pipefail
          VDEX="$(find firmware-analysis -type f -name boot-carservices.vdex -print -quit)"
          test -n "$VDEX"
          mkdir -p firmware-analysis/carservices-vdex
          cp "$VDEX" firmware-analysis/carservices-vdex/boot-carservices.vdex
          file "$VDEX" | tee firmware-analysis/carservices-vdex/file-info.txt
          sha256sum "$VDEX" | tee firmware-analysis/carservices-vdex/sha256.txt
          /tmp/vdexExtractor/bin/vdexExtractor --get-api -i "$VDEX" | tee firmware-analysis/carservices-vdex/api-version.txt
          /tmp/vdexExtractor/bin/vdexExtractor \
            -i "$VDEX" \
            -o firmware-analysis/carservices-vdex \
            --dis -f \
            -l firmware-analysis/carservices-vdex/disassembly.log
          test -s firmware-analysis/carservices-vdex/disassembly.log
          grep -n -E 'McuService|sendCmdCarStatus|sendAccState|sendReverseState|sendCmdAudioMux|doExtAudioEffect|mute=' \
            firmware-analysis/carservices-vdex/disassembly.log \
            > firmware-analysis/carservices-vdex/targeted-hits.txt || true
          cat firmware-analysis/carservices-vdex/targeted-hits.txt

      - name: Inventory native libraries and search CD3313 audio symbols
        shell: bash
        run: |
          set -euo pipefail
          report="firmware-analysis/NATIVE_AUDIO_SCAN.txt"
          : > "$report"
          echo "Firmware native-library scan" >> "$report"
          echo "Generated: $(date -u +%FT%TZ)" >> "$report"
          echo >> "$report"
          find firmware-analysis -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.ko' \) -print0 |
          while IFS= read -r -d '' f; do
            {
              echo "===== $f ====="
              file "$f" || true
              strings -a "$f" 2>/dev/null |
                grep -Ei 'audiomux|ExtAudioMuxer|SendCmdAudioMux|cd3313|carstatus|AudioEffect|ISourceService|SourceService|doExtAudioEffect|DLCustAudio|AudioCmdHandler|HFP|AudioTasteRunning' |
                sort -u | head -n 300 || true
              if file "$f" | grep -q ELF; then
                readelf -Ws "$f" 2>/dev/null |
                  grep -Ei 'audiomux|ExtAudioMuxer|SendCmdAudioMux|cd3313|AudioEffect|SourceService' |
                  head -n 100 || true
              fi
              echo
            } >> "$report"
          done
          echo "Scanned $(find firmware-analysis -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.ko' \) | wc -l) native objects" >> "$report"
          cat "$report"

      - name: Produce a compact report for the paired CD3313 module
        shell: bash
        run: |
          set -euo pipefail
          MODULE="$(find firmware-analysis -type f -path '*/vendor/lib/modules/cd3313.ko' -print -quit)"
          test -n "$MODULE"
          OUT=firmware-analysis/cd3313-current
          mkdir -p "$OUT"
          cp "$MODULE" "$OUT/cd3313.ko"
          file "$OUT/cd3313.ko" | tee "$OUT/file-info.txt"
          sha256sum "$OUT/cd3313.ko" | tee "$OUT/sha256.txt"
          arm-linux-gnueabi-readelf -h -n -Ws "$OUT/cd3313.ko" > "$OUT/elf-symbols.txt"
          arm-linux-gnueabi-objdump -drwC "$OUT/cd3313.ko" > "$OUT/disassembly.txt"
          strings -a -t x "$OUT/cd3313.ko" > "$OUT/strings.txt"
          grep -Ein 'channel_to_cd3313|RADIO|AUX|EXBT|DAB|set_input_channel|set_input_mute|set_master_mute|channel_mute|master_mute|gpio' \
            "$OUT/elf-symbols.txt" "$OUT/disassembly.txt" "$OUT/strings.txt" > "$OUT/focused-hits.txt" || true
          test -s "$OUT/disassembly.txt"
          test -s "$OUT/focused-hits.txt"

      - name: Upload compact CD3313 module analysis
        uses: actions/upload-artifact@v6
        with:
          name: cd3313-current-module-analysis
          path: firmware-analysis/cd3313-current/
          if-no-files-found: error
          retention-days: 14

      - name: Extract focused board audio routing evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          mkdir -p "$OUT/decompiled-dtb"
          find firmware-analysis -type f \
            \( -iname '*.dts' -o -iname '*.dtsi' -o -iname '*.dtb' -o -iname '*.dtbo' \
               -o -iname '*.xml' -o -iname '*.conf' -o -iname '*.ini' -o -iname '*.cfg' \
               -o -iname '*.rc' -o -iname '*.prop' -o -iname '*.mk' \) \
            ! -path '*/board-audio-routing/*' -print | sort > "$OUT/candidate-files.txt"

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          root = Path("firmware-analysis")
          out = Path("firmware-analysis/board-audio-routing")
          text_ext = {".dts", ".dtsi", ".xml", ".conf", ".ini", ".cfg", ".rc", ".prop", ".mk"}
          rx = re.compile(
              r"FM_I2S_Playback|FM_I2S_Capture|MRGRX_PLayback|MRGRX_CAPTURE|"
              r"FM_TUNER|AUDIO_DEVICE_IN_FM_TUNER|GPIO_Radio_DAB_SW|"
              r"GPIO39_Aux_Aux2_SW|aud_path|i2s_pad|FM_I2S|"
              r"GPIO.{0,32}(FM|Radio|DAB)|(?:FM|Radio|DAB).{0,32}GPIO|"
              r"(?:FM|Radio).{0,32}I2S|I2S.{0,32}(?:FM|Radio)",
              re.IGNORECASE,
          )
          match_path = out / "text-matches.txt"
          scanned = 0
          matches = 0
          with match_path.open("w", errors="replace") as report:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in text_ext:
                      continue
                  try:
                      if path.stat().st_size > 8 * 1024 * 1024:
                          continue
                      raw = path.read_bytes()
                      if b"\x00" in raw[:4096]:
                          continue
                      content = raw.decode("utf-8", errors="replace")
                  except OSError:
                      continue
                  scanned += 1
                  for number, line in enumerate(content.splitlines(), 1):
                      if rx.search(line):
                          report.write(f"{path}:{number}:{line[:1000]}\n")
                          matches += 1

          dtb_index = 0
          with (out / "dtb-conversion.txt").open("w") as log:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in {".dtb", ".dtbo"}:
                      continue
                  dtb_index += 1
                  target = out / "decompiled-dtb" / f"{dtb_index:04d}-{path.stem}.dts"
                  result = subprocess.run(
                      ["dtc", "-I", "dtb", "-O", "dts", "-o", str(target), str(path)],
                      text=True, capture_output=True,
                  )
                  log.write(f"{path} -> {target}: exit={result.returncode}\n")
                  if result.stderr:
                      log.write(result.stderr[:4000] + "\n")
                  if result.returncode != 0 and target.exists():
                      target.unlink()
          print(f"Scanned {scanned} text configuration files; found {matches} matching lines; attempted {dtb_index} DTB/DTBO conversions")
          PY

          find firmware-analysis -type f \
            \( -iname '*.ko' -o -iname '*.dtb' -o -iname '*.dtbo' -o -iname '*audio*policy*' \
               -o -iname '*audio*platform*' -o -iname '*audio*config*' \) \
            ! -path '*/board-audio-routing/*' -print | sort > "$OUT/audio-and-device-tree-binaries.txt"
          test -s "$OUT/candidate-files.txt"
          test -f "$OUT/text-matches.txt"
          echo "Candidate files: $(wc -l < "$OUT/candidate-files.txt")"
          echo "Matched lines: $(wc -l < "$OUT/text-matches.txt")"
          echo "Decompiled DTBs: $(find "$OUT/decompiled-dtb" -type f -name '*.dts' | wc -l)"

      - name: Collect AudioALSADeviceParser and policy configuration
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          mkdir -p "$OUT/config-files"
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path("firmware-analysis")
          out = Path("firmware-analysis/board-audio-routing/config-files")
          wanted = {
              "audio_device.xml", "audio_em.xml", "audio_policy_configuration.xml",
              "audio_policy.conf", "audio_effects.xml", "AudioParamOptions.xml",
              "audio_param_options.xml",
          }
          found = []
          for path in root.rglob("*"):
              if not path.is_file() or path.name not in wanted:
                  continue
              if "board-audio-routing" in path.parts:
                  continue
              rel = path.relative_to(root)
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
              found.append((str(rel), target.stat().st_size))
          with (out.parent / "selected-config-files.txt").open("w") as f:
              for name, size in found:
                  f.write(f"{name} ({size} bytes)\n")
          print(f"Copied {len(found)} targeted audio/policy configuration files")
          PY
          find firmware-analysis -type f \
            \( -iname 'boot*.img' -o -iname 'dtbo*' -o -iname '*dtb*' -o -iname '*.img' \
               -o -iname 'lk.bin' -o -iname 'preloader*' \) \
            ! -path '*/board-audio-routing/*' -print | sort > "$OUT/boot-and-dtb-image-candidates.txt"
          grep -RInI -E 'FM_I2S|MRGRX|FM_TUNER|tuner|radio|PCM|CARD|card|pcm|AudioALSADeviceParser|FM_DIRECT_CONTROL' \
            "$OUT/config-files" > "$OUT/config-search.txt" || true
          echo "Selected config files: $(wc -l < "$OUT/selected-config-files.txt")"
          echo "Boot/DTB image candidates: $(wc -l < "$OUT/boot-and-dtb-image-candidates.txt")"
          echo "Config matches: $(wc -l < "$OUT/config-search.txt")"

      - name: Analyze FM tuner kernel modules
        shell: bash
        run: |
          set -euo pipefail
          SRC=firmware-analysis/vendor/lib/modules
          OUT=firmware-analysis/fm-tuner-drivers
          mkdir -p "$OUT"
          for module in fmradio_drv qn8027 qn8035 si475x tda7708LX wmt_drv; do
            input="$SRC/$module.ko"
            if [ ! -f "$input" ]; then
              echo "MISSING $input" >> "$OUT/module-inventory.txt"
              continue
            fi
            mkdir -p "$OUT/$module"
            cp "$input" "$OUT/$module/$module.ko"
            (
              cd "$OUT/$module"
              sha256sum "$module.ko" > sha256.txt
              file "$module.ko" > file.txt
              readelf -h -n -Ws -rW "$module.ko" > elf-report.txt 2>&1 || true
              arm-linux-gnueabi-objdump -drwC "$module.ko" > disassembly.txt 2>&1 || true
              strings -a -t x "$module.ko" > strings.txt
              grep -i -E 'fm|radio|tuner|i2s|ioctl|audio_info|aud_path|pad|gpio|wmt|chip|i2c|/dev/' strings.txt > focused-strings.txt || true
            )
            echo "FOUND $input" >> "$OUT/module-inventory.txt"
          done
          test -s "$OUT/module-inventory.txt"
          find "$OUT" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort > "$OUT/file-inventory.txt"
          echo "Analyzed modules:"
          cat "$OUT/module-inventory.txt"

      - name: Scan init scripts for FM and WMT module loading
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          mkdir -p "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("firmware-analysis")
          out = Path("firmware-analysis/board-audio-routing")
          rx = re.compile(
              r"fmradio_drv|qn8027|qn8035|si475x|tda7708LX|wmt_drv|"
              r"insmod|modprobe|modules\.load|/dev/fm",
              re.IGNORECASE,
          )
          extensions = {".rc", ".sh", ".load", ".conf", ".prop", ".xml", ".mk", ".cfg", ".txt"}
          matches = []
          candidates = []
          for path in root.rglob("*"):
              if not path.is_file() or "board-audio-routing" in path.parts:
                  continue
              if path.suffix.lower() not in extensions and "modules.load" not in path.name.lower():
                  continue
              try:
                  if path.stat().st_size > 4 * 1024 * 1024:
                      continue
                  raw = path.read_bytes()
                  if b"\x00" in raw[:4096]:
                      continue
                  content = raw.decode("utf-8", errors="replace")
              except OSError:
                  continue
              candidates.append(str(path))
              for n, line in enumerate(content.splitlines(), 1):
                  if rx.search(line):
                      matches.append(f"{path}:{n}:{line[:1000]}")
          (out / "init-module-candidates.txt").write_text("\n".join(candidates) + ("\n" if candidates else ""))
          (out / "module-load-references.txt").write_text("\n".join(matches) + ("\n" if matches else ""))
          print(f"Scanned {len(candidates)} init/config text files; found {len(matches)} module-load references")
          PY

      - name: Search firmware for FM direct-control clients
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path("firmware-analysis")
          out = Path("firmware-analysis/board-audio-routing/fm-parameter-callers.txt")
          extensions = {".apk", ".jar", ".dex", ".vdex", ".odex", ".so", ".xml", ".conf", ".rc", ".prop"}
          rx = re.compile(
              r"FM_DIRECT_CONTROL|fm_direct_control|FM_I2S_Playback|FM_I2S_Capture|"
              r"MRGRX_PLayback|MRGRX_CAPTURE|FM_IOCTL_GET_AUDIO_INFO|FM_IOCTL_I2S_SETTING",
              re.IGNORECASE,
          )
          scanned = 0
          hits = 0
          with out.open("w") as report:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in extensions:
                      continue
                  if "board-audio-routing" in path.parts or "fm-tuner-drivers" in path.parts:
                      continue
                  try:
                      if path.stat().st_size > 50 * 1024 * 1024:
                          continue
                      result = subprocess.run(
                          ["strings", "-a", "-n", "5", str(path)],
                          text=True, capture_output=True, errors="replace",
                      )
                  except (OSError, subprocess.SubprocessError):
                      continue
                  scanned += 1
                  for line in result.stdout.splitlines():
                      if rx.search(line):
                          report.write(f"{path}: {line[:1000]}\n")
                          hits += 1
          print(f"Scanned {scanned} firmware binaries/configs; found {hits} FM direct-control or endpoint string hits")
          PY

      - name: Disassemble audio policy custom extension
        shell: bash
        run: |
          set -euo pipefail
          SRC=firmware-analysis/system/lib/libaudiopolicycustomextensions.so
          OUT=firmware-analysis/board-audio-routing/policy-extension
          if [ ! -f "$SRC" ]; then
            echo "Policy extension binary not found at $SRC" > firmware-analysis/board-audio-routing/policy-extension-status.txt
            exit 0
          fi
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/libaudiopolicycustomextensions.so"
          cd "$OUT"
          sha256sum libaudiopolicycustomextensions.so > sha256.txt
          file libaudiopolicycustomextensions.so > file.txt
          readelf -h -n -Ws -rW libaudiopolicycustomextensions.so > elf-report.txt 2>&1 || true
          arm-linux-gnueabi-objdump -drwC libaudiopolicycustomextensions.so > disassembly.txt 2>&1 || true
          strings -a -t x libaudiopolicycustomextensions.so > strings.txt
          grep -i -E 'FM_DIRECT_CONTROL|FM_I2S|MRGRX|fm|audio parameter|setParameters|set_parameters' strings.txt > focused-strings.txt || true

      - name: Trace FM callback imports and Audio Policy config selection
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          mkdir -p "$OUT/fm-wmt-crossrefs" "$OUT/policy-stack"
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess
          root = Path("firmware-analysis")
          out = root / "board-audio-routing"
          symbols = re.compile(
              r"fm_low_ops_register|fm_i2s_set|fm_get_aud_info|mt6627fm_get_audio_info|"
              r"wmt_plat_aif_cb_reg|wmt_plat_i2s_ctrl|wmt_plat_audio_ctrl",
              re.IGNORECASE,
          )
          refs = []
          modules = root / "vendor_lib/lib/modules"
          for path in modules.rglob("*.ko") if modules.exists() else []:
              try:
                  if path.stat().st_size > 20 * 1024 * 1024:
                      continue
                  result = subprocess.run(["readelf", "-Ws", str(path)], text=True, capture_output=True, errors="replace")
                  matches = [line for line in result.stdout.splitlines() if symbols.search(line) and re.search(r"UND|GLOBAL|WEAK", line)]
                  if matches:
                      refs.append(f"MODULE {path}")
                      refs.extend("  " + line.strip() for line in matches)
                      shutil.copy2(path, out / "fm-wmt-crossrefs" / path.name)
              except (OSError, subprocess.SubprocessError):
                  continue
          (out / "fm-wmt-symbol-crossrefs.txt").write_text("\n".join(refs) + ("\n" if refs else "No matching FM/WMT symbols found in module symbol tables.\n"))
          libs = []
          path_rx = re.compile(r"audio_policy_configuration|audio_policy\.conf|AUDIO_POLICY_CONFIG|/vendor/etc|/system/etc", re.IGNORECASE)
          for path in root.rglob("libaudiopolicy*.so"):
              try:
                  if path.stat().st_size > 30 * 1024 * 1024:
                      continue
                  raw = subprocess.run(["strings", "-a", "-n", "5", str(path)], text=True, capture_output=True, errors="replace").stdout
                  hits = [line for line in raw.splitlines() if path_rx.search(line)]
                  if hits:
                      dst = out / "policy-stack" / path.name
                      shutil.copy2(path, dst)
                      libs.append(f"LIB {path} -> {dst}")
                      libs.extend("  " + line[:500] for line in hits)
              except (OSError, subprocess.SubprocessError):
                  continue
          pcm_rx = re.compile(r"FM_I2S_Playback|FM_I2S_Capture|MRGRX_PLayback|MRGRX_CAPTURE", re.IGNORECASE)
          pcm_hits = []
          pcm_out = out / "fm-i2s-pcm-name-hits.txt"
          pcm_modules = out / "fm-i2s-pcm-modules"
          pcm_modules.mkdir(exist_ok=True)
          for path in modules.rglob("*.ko") if modules.exists() else []:
              try:
                  if path.stat().st_size > 20 * 1024 * 1024:
                      continue
                  raw = subprocess.run(["strings", "-a", "-t", "x", str(path)], text=True, capture_output=True, errors="replace").stdout
                  matches = [line for line in raw.splitlines() if pcm_rx.search(line)]
                  if matches:
                      pcm_hits.append(f"MODULE {path}")
                      pcm_hits.extend("  " + line[:400] for line in matches[:80])
                      shutil.copy2(path, pcm_modules / path.name)
              except (OSError, subprocess.SubprocessError):
                  continue
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".xml",".conf",".cfg",".prop",".rc",".txt"}:
                  continue
              try:
                  if path.stat().st_size > 10 * 1024 * 1024:
                      continue
                  matches = [line.strip() for line in path.read_text(errors="replace").splitlines() if pcm_rx.search(line)]
                  if matches:
                      pcm_hits.append(f"CONFIG {path}")
                      pcm_hits.extend("  " + line[:400] for line in matches[:80])
              except OSError:
                  continue
          pcm_out.write_text("\n".join(pcm_hits) + ("\n" if pcm_hits else "No FM I2S PCM endpoint names found in scanned kernel modules or text configs.\n"))
          print(f"FM I2S PCM-name hits: {len(pcm_hits)}")
          (out / "audio-policy-config-paths.txt").write_text("\n".join(libs) + ("\n" if libs else "No policy config path strings found in matching libraries.\n"))
          print(f"Found {len(refs)} FM/WMT symbol lines; found {len(libs)} policy config path lines")
          PY

      - name: Locate FM customer config and proc writers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess
          root=Path("firmware-analysis")
          out=root/"board-audio-routing"/"fm-customer-config"
          out.mkdir(parents=True, exist_ok=True)
          config_files=[]
          for p in root.rglob("*"):
              if p.is_file() and ("fm_cust.cfg" in p.name.lower() or "fm_cust" in p.name.lower()):
                  config_files.append(p)
          file_lines=[]
          for p in config_files:
              rel=str(p.relative_to(root)).replace("/","__")
              dst=out/rel
              shutil.copy2(p,dst)
              file_lines.append(f"{p} -> {dst}")
              try:
                  if p.suffix.lower() in {".cfg",".conf",".txt",".ini",".xml",".prop"}:
                      (out/(rel+".text")).write_text(p.read_text(errors="replace")[:200000])
                  else:
                      data=subprocess.run(["strings","-a","-t","x",str(p)],capture_output=True,text=True,errors="replace").stdout
                      (out/(rel+".strings")).write_text(data[:200000])
              except (OSError, subprocess.SubprocessError):
                  pass
          (out/"file-list.txt").write_text("\n".join(file_lines)+("\n" if file_lines else "No fm_cust-named file found in extracted firmware tree.\n"))
          rx=re.compile(r"/proc/fm|fm_cust\.cfg|fm_cust_config_setup|FM_IOCTL_I2S_SETTING|FM_IOCTL_GET_AUDIO_INFO|ro\.bluetooth\.a2dp_offload\.supported|persist\.bluetooth\.a2dp_offload\.disabled",re.I)
          hits=[]
          policy_files=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if p.name.lower() in {"audio_policy_configuration.xml","audio_policy_configuration_a2dp_offload_disabled.xml"}:
                  policy_files.append(p)
              if p.suffix.lower() not in {".so",".apk",".jar",".vdex",".odex",".dex",".rc",".sh",".prop",".xml",".conf",".cfg",".txt"}:
                  continue
              try:
                  if p.stat().st_size>30*1024*1024:
                      continue
                  if p.suffix.lower() in {".rc",".sh",".prop",".xml",".conf",".cfg",".txt"}:
                      data=p.read_text(errors="replace")
                  else:
                      data=subprocess.run(["strings","-a",str(p)],capture_output=True,text=True,errors="replace").stdout
                  lines=[line.strip() for line in data.splitlines() if rx.search(line)]
                  if lines:
                      hits.append(f"FILE {p}")
                      hits.extend("  "+line[:500] for line in lines[:100])
              except (OSError, subprocess.SubprocessError):
                  continue
          (out/"fm-proc-and-policy-property-references.txt").write_text("\n".join(hits)+("\n" if hits else "No FM proc/config or A2DP policy property references found in scanned files.\n"))
          policy_lines=[]
          for p in policy_files:
              rel=str(p.relative_to(root)).replace("/","__")
              dst=out/rel
              shutil.copy2(p,dst)
              policy_lines.append(f"{p} -> {dst}")
          (out/"audio-policy-config-files.txt").write_text("\n".join(policy_lines)+("\n" if policy_lines else "No matching audio policy XML file found.\n"))
          print(f"FM customer files: {len(config_files)}; FM/proc/property hits: {len(hits)}; policy XML files: {len(policy_files)}")
          PY

      - name: Upload FM tuner driver analysis
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-fm-tuner-driver-analysis
          path: firmware-analysis/fm-tuner-drivers/
          if-no-files-found: error
          retention-days: 14

      - name: Upload focused board audio routing evidence
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-board-audio-routing-evidence
          path: firmware-analysis/board-audio-routing/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reassembled archives, extracted files and reports
        uses: actions/upload-artifact@v6
        with:
          name: firmware-library-analysis
          path: firmware-analysis/
          if-no-files-found: error
          retention-days: 14

