name: Public firmware compute

on:
  push:
    branches: [main]
    paths:
      - firmware/EXTRACT_APPROVED
  workflow_dispatch:
    inputs:
      task:
        description: Bounded analysis task
        required: true
        type: choice
        options:
          - inventory
          - extract
          - all-light
      archive_directory:
        description: Archive directory under firmware/archives (used for extraction)
        required: false
        default: firmware/archives/mt8163
        type: string
      retention_days:
        description: Actions artifact retention (1-30 days)
        required: true
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: public-compute-${{ github.ref }}-${{ inputs.task || 'extract' }}
  cancel-in-progress: true

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        env:
          TASK: ${{ inputs.task || 'extract' }}
          ARCHIVE_DIRECTORY: ${{ inputs.archive_directory || 'firmware/archives/mt8163' }}
          RETENTION: ${{ inputs.retention_days || '14' }}
        run: |
          set -euo pipefail
          case "$TASK" in inventory|extract|all-light) ;; *) echo "Invalid task"; exit 2;; esac
          case "$RETENTION" in ''|*[!0-9]*) echo "Invalid retention"; exit 2;; esac
          if [ "$RETENTION" -lt 1 ] || [ "$RETENTION" -gt 30 ]; then echo "Retention must be 1..30"; exit 2; fi
          if [ "$TASK" = "extract" ]; then
            case "$ARCHIVE_DIRECTORY" in firmware/archives/*) ;; *) echo "Archive directory must be under firmware/archives"; exit 2;; esac
            case "$ARCHIVE_DIRECTORY" in *..*|/*) echo "Unsafe archive directory"; exit 2;; esac
            resolved="$(realpath -e -- "$ARCHIVE_DIRECTORY")"
            case "$resolved" in "$GITHUB_WORKSPACE"/firmware/archives/*) ;; *) echo "Archive directory symlink escapes firmware/archives"; exit 2;; esac
            test -d "$resolved"
            if ! find "$resolved" -type f \( -iname '*.zip' -o -iname '*.zip.[0-9][0-9][0-9]' \) -print -quit | grep -q .; then
              echo "No ZIP archives or split ZIP volumes found."
              exit 2
            fi
          fi

      - name: Inventory original archive files
        if: inputs.task == 'inventory' || inputs.task == 'all-light' || github.event_name == 'push' || inputs.task == 'extract'
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -d '' archives < <(find firmware/archives -type f \( -iname '*.zip' -o -iname '*.zip.[0-9][0-9][0-9]' -o -iname '*.tar' -o -iname '*.tar.gz' -o -iname '*.tgz' \) -print0 | sort -z)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No archive files present; nothing to inventory."
            printf '{"schema_version":1,"archives":[],"status":"no-inputs"}\n' > output/archive-inventory.json
          else
            python scripts/firmware/archive_inventory.py "${archives[@]}" --output output/archive-inventory.json
          fi

      - name: Reassemble split ZIP volumes and extract safely
        if: inputs.task == 'extract' || github.event_name == 'push'
        env:
          ARCHIVE_DIRECTORY: ${{ inputs.archive_directory }}
        run: |
          set -euo pipefail
          mkdir -p output/extracted
          python scripts/firmware/process_archive_sets.py \
            --root "$ARCHIVE_DIRECTORY" \
            --extract-root output/extracted \
            --json output/archive-manifest.json \
            --markdown output/archive-inventory.md

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-compute-${{ inputs.task || 'extract' }}-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || '14' }}
