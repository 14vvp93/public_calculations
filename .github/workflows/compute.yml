name: Public firmware compute

on:
  workflow_dispatch:
    inputs:
      task:
        description: Bounded analysis task
        required: true
        type: choice
        options:
          - inventory
          - extract
          - all-light
      archive_path:
        description: Optional path under firmware/archives (required for extract)
        required: false
        type: string
      retention_days:
        description: Actions artifact retention (1-30 days)
        required: true
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: public-compute-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        env:
          TASK: ${{ inputs.task }}
          ARCHIVE_PATH: ${{ inputs.archive_path }}
          RETENTION: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          case "$TASK" in inventory|extract|all-light) ;; *) echo "Invalid task"; exit 2;; esac
          case "$RETENTION" in ''|*[!0-9]*) echo "Invalid retention"; exit 2;; esac
          if [ "$RETENTION" -lt 1 ] || [ "$RETENTION" -gt 30 ]; then echo "Retention must be 1..30"; exit 2; fi
          if [ -n "$ARCHIVE_PATH" ]; then
            case "$ARCHIVE_PATH" in firmware/archives/*) ;; *) echo "Archive must be under firmware/archives"; exit 2;; esac
            case "$ARCHIVE_PATH" in *..*|/*) echo "Unsafe archive path"; exit 2;; esac
            test -f "$ARCHIVE_PATH"
          fi
          if [ "$TASK" = extract ] && [ -z "$ARCHIVE_PATH" ]; then
            echo "extract requires archive_path"; exit 2
          fi

      - name: Inventory archives
        if: inputs.task == 'inventory' || inputs.task == 'all-light'
        run: |
          set -euo pipefail
          mkdir -p output
          shopt -s nullglob
          archives=(firmware/archives/*)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No archives present; nothing to inventory."
            printf '{"schema_version":1,"archives":[],"status":"no-inputs"}\n' > output/archive-inventory.json
          else
            python scripts/firmware/archive_inventory.py "${archives[@]}" --output output/archive-inventory.json
          fi

      - name: Safe extraction
        if: inputs.task == 'extract'
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          set -euo pipefail
          mkdir -p output/extracted
          python scripts/firmware/safe_extract.py "$ARCHIVE_PATH" output/extracted

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: public-compute-${{ inputs.task }}-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
