name: Public firmware compute

on:
  workflow_dispatch:
    inputs:
      task:
        description: Bounded task against the canonical extracted firmware dataset
        required: true
        type: choice
        options:
          - inventory
          - verify
          - all-light
          - audio-inventory
      retention_days:
        description: Result artifact retention (1-90 days)
        required: true
        default: "14"
        type: string
  workflow_call:
    inputs:
      task:
        description: Bounded task against the canonical extracted firmware dataset
        required: false
        default: verify
        type: string
      retention_days:
        description: Result artifact retention (1-90 days)
        required: false
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: public-compute-${{ github.repository }}-${{ github.ref }}-${{ inputs.task || 'verify' }}
  cancel-in-progress: true

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public firmware dataset and compute tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 14vvp93/public_calculations
          ref: main
          path: worker
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate task and retention
        env:
          TASK: ${{ inputs.task || 'verify' }}
          RETENTION: ${{ inputs.retention_days || '14' }}
        run: |
          set -euo pipefail
          case "$TASK" in inventory|verify|all-light|audio-inventory) ;; *) echo "Invalid task"; exit 2;; esac
          case "$RETENTION" in ''|*[!0-9]*) echo "Invalid retention"; exit 2;; esac
          if [ "$RETENTION" -lt 1 ] || [ "$RETENTION" -gt 90 ]; then echo "Retention must be 1..90"; exit 2; fi
          test -s worker/firmware/manifests/mt8163-extracted.json
          test -d worker/firmware/extracted/system
          test -d worker/firmware/extracted/vendor

      - name: Inventory firmware and verify manifest in one pass
        if: inputs.task == 'inventory' || inputs.task == 'all-light' || inputs.task == 'verify' || inputs.task == 'audio-inventory'
        env:
          TASK: ${{ inputs.task || 'verify' }}
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          worker = Path("worker")
          task = os.environ["TASK"]
          verify = task in {"verify", "audio-inventory"}
          manifest = None
          expected = {}
          failures = []
          if verify:
              manifest = json.loads((worker / "firmware/manifests/mt8163-extracted.json").read_text())
              expected = {item["path"]: item for item in manifest["files"]}

          roots = [worker / "firmware/extracted", worker / "firmware/dumps/mt8163"]
          rows = []
          seen_extracted = set()
          verified_count = 0

          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  relative = path.relative_to(worker).as_posix()
                  size = path.stat().st_size
                  sha256 = digest.hexdigest()
                  rows.append({"path": path.as_posix(), "size": size, "sha256": sha256})

                  if verify and root == worker / "firmware/extracted":
                      seen_extracted.add(relative)
                      item = expected.get(relative)
                      if item is None:
                          failures.append(f"UNMANIFESTED {relative}")
                      elif size != item["size"] or sha256 != item["sha256"]:
                          failures.append(f"INTEGRITY_MISMATCH {relative}")
                      else:
                          verified_count += 1

          if verify:
              for missing in sorted(set(expected) - seen_extracted):
                  failures.append(f"MISSING {missing}")
              if len(expected) != manifest["file_count"]:
                  failures.append("MANIFEST_FILE_COUNT_MISMATCH")

          integrity = {
              "status": ("failed" if failures else "passed") if verify else "not_requested",
              "verified_file_count": verified_count,
              "failure_count": len(failures),
              "failures": failures,
          }
          result = {
              "file_count": len(rows),
              "total_bytes": sum(item["size"] for item in rows),
              "files": rows,
              "integrity": integrity,
          }
          Path("output/firmware-inventory.json").write_text(json.dumps(result, indent=2) + "\\n")
          print(f"Inventoried {len(rows)} public firmware files ({result['total_bytes']} bytes)")
          if verify:
              print(f"SHA-256 verified {verified_count}/{len(expected)} extracted firmware files")
              if failures:
                  raise SystemExit(f"Firmware integrity failed: {len(failures)} mismatches")
          PY

      - name: Analyze Android audio stack and DSP modules
        if: inputs.task == 'audio-inventory'
        run: |
          set -euo pipefail
          python worker/scripts/firmware/audio_stack_inventory.py \
            --extracted-root worker/firmware/extracted \
            --dump-root worker/firmware/dumps/mt8163 \
            --json output/audio-stack-inventory.json \
            --markdown output/audio-stack-report.md

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-compute-${{ inputs.task || 'verify' }}-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || '14' }}
