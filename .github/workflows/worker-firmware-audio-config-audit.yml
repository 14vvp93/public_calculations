name: Validate extracted firmware audio configuration

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable branch, tag, or commit in the primary repository
        required: false
        type: string
        default: main
    secrets:
      SOURCE_REPO_READ_TOKEN:
        required: false
permissions:
  contents: read

jobs:
  inspect-curated-firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate read-only access to primary repository
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Add SOURCE_REPO_READ_TOKEN to the caller repository's Actions secrets. It must be a fine-grained token with Contents: Read-only access to 14vvp93/mt8163_audio_engine."
            exit 2
          fi

      - name: Check out primary repository at requested revision
        uses: actions/checkout@v5
        with:
          repository: 14vvp93/mt8163_audio_engine
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Validate curated firmware inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source/reference-materials/extracted
          OUT=build/firmware-audio-audit
          mkdir -p "$OUT"
          test -s "$ROOT/manifest.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET

          root = Path("source/reference-materials/extracted")
          out = Path("build/firmware-audio-audit")
          manifest = json.loads((root / "manifest.json").read_text())
          rows = []
          failures = []
          for item in manifest["files"]:
              path = root / item["path"]
              if not path.is_file():
                  failures.append(f"MISSING {path}")
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"]:
                  failures.append(f"HASH_MISMATCH {path}")
              rows.append(f"{digest}  {path}")
              if path.suffix.lower() == ".xml":
                  try:
                      ET.parse(path)
                  except Exception as exc:
                      failures.append(f"XML_INVALID {path}: {exc}")
          (out / "sha256-manifest.txt").write_text("\n".join(rows) + "\n")
          (out / "validation-errors.txt").write_text("\n".join(failures) + ("\n" if failures else ""))
          (out / "summary.txt").write_text(
              f"Curated files: {len(manifest['files'])}\n"
              f"Bytes: {manifest['total_bytes']}\n"
              f"XML/hash errors: {len(failures)}\n"
          )
          print((out / "summary.txt").read_text())
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Index audio routing and DSP configuration
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source/reference-materials/extracted
          OUT=build/firmware-audio-audit
          grep -RniE 'audio|a2dp|fm|bluetooth|speaker|headset|loudness|equalizer|effect|mixer|i2s' \
            "$ROOT/system" "$ROOT/vendor" --include='*.xml' --include='*.conf' --include='*.cfg' --include='*.rc' \
            > "$OUT/audio-config-reference-index.txt" || true
          find "$ROOT" -type f -printf '%P\t%s bytes\n' | sort > "$OUT/curated-file-list.txt"

      - name: Upload firmware audio configuration audit
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-firmware-audio-config-audit
          path: build/firmware-audio-audit/
          if-no-files-found: error
          retention-days: 30
